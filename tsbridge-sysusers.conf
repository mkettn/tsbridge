# systemd-sysusers snippet that creates the dedicated, unprivileged
# tsbridge system user/group. Install as /etc/sysusers.d/tsbridge.conf
# and run `systemd-sysusers` (or reboot) to apply. See README.md for the
# `useradd` equivalent on systems without sysusers.
#
# Type Name     ID    GECOS                Home directory  Shell
u      tsbridge -     "tsbridge service"   /var/lib/tsbridge  /usr/sbin/nologin
