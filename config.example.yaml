# tsbridge config file.
#
# Install this at /etc/tsbridge/config.yaml and adjust the values below.
# See README.md for the full field reference.

# Hostname this node presents to the tailnet's control server. Shows up in
# `tailscale status` / the admin console as this node's name.
hostname: bridge-myserver

# Directory tsnet uses to persist node identity (keys, machine state)
# across restarts. Required unless ephemeral: true. Must be writable by
# the user tsbridge runs as; the systemd unit maps this to
# StateDirectory=tsbridge (/var/lib/tsbridge).
state_dir: /var/lib/tsbridge

# If true, this node registers as an ephemeral tailnet node and is
# automatically removed from the tailnet on clean shutdown; state_dir is
# not required to persist identity across restarts. If false (the
# default), the node keeps a stable identity/IP in state_dir across
# restarts -- prefer this if ACLs or other tailnet policy pin to this
# node's hostname or IP.
ephemeral: false

# Coordination/control server this node registers with and joins its
# tailnet through. Leave unset (or empty) to use Tailscale's own control
# server -- the normal case. Set this to run against a self-hosted
# Headscale instance instead; tsbridge handles registering with it the
# same way it would with Tailscale (see README's "Self-hosted control
# servers" section), so pointing tsbridge here is the only step, no
# separate registration procedure needed.
# control_url: https://headscale.example.com

# Unix group that should own each bridge socket, so other local
# processes (e.g. a reverse proxy running as a different user) can
# connect. The tsbridge service user must be a member of this group
# (see tsbridge.service's SupplementaryGroups=, commented out by default
# since "www-data" may not exist on every system -- uncomment both once
# you've picked a real group for your setup).
# socket_group: www-data

# Permission bits applied to every bridge socket. Defaults to "0660" if
# omitted.
socket_mode: "0660"

# Unix socket for the read-only management API: tailnet status and each
# bridge's health (GET /status, GET /bridges). It cannot add, change or
# remove bridges -- edit this file and restart for that. Leave unset (the
# default) to disable it entirely -- no socket is created. See README.md's
# "Management API" section.
#
# It defaults to "0600" (owner-only) rather than socket_mode's "0660",
# and has its own independent group setting below rather than reusing
# socket_group.
# management_socket: /run/tsbridge/control.sock
# management_socket_mode: "0600"
# management_socket_group: admins

# All bridges this instance serves. Each maps a local Unix socket to a
# host:port reachable over the tailnet. `mode` is optional and defaults
# to "tcp" (raw byte copy, protocol-agnostic) -- "http" is the other
# option, which terminates HTTP on the socket and reverse-proxies each
# request to target instead (see README's "HTTP mode" section for what
# that buys you over tcp for an HTTP-shaped service).
bridges:
  - name: my-service
    listen: /run/tsbridge/my-service.sock
    target: [remote-machine:1234]
    mode: tcp
  - name: my-http-service
    listen: /run/tsbridge/my-http-service.sock
    target: [other-machine:8080]
    mode: http
    # mode: http only. Optional, defaults to false: the proxied request's
    # Host header passes through unchanged (whatever the client sent).
    # Set true if target routes/validates by hostname instead -- a
    # `tailscale serve`-published target is the common case -- so it
    # gets target's own host:port as its Host header instead.
    # rewrite_host: true
  - name: my-disabled-service
    listen: /run/tsbridge/my-disabled-service.sock
    target: [third-machine:9090]
    # Optional, defaults to true. false defines the bridge (it shows up
    # in management_socket's GET /bridges, occupying this listen path)
    # but doesn't create its socket.
    enabled: false

# Ports on this node's tailnet address that forward to the host, the
# opposite direction of bridges. `mode` is "tcp" (default), "http" or "udp";
# `target` is a host:port (IP literal or localhost) or, for tcp, a Unix
# socket path. Access is controlled by your tailnet ACLs. See README.md's
# "Exposing host services" section.
# expose:
#   - name: web
#     port: 8080
#     target: 127.0.0.1:3000
#   - name: app
#     port: 9000
#     target: /run/app/app.sock
#   - name: site
#     port: 80
#     mode: http              # reverse-proxy requests instead of raw bytes
#     target: 127.0.0.1:3000
#   - name: dns
#     port: 53
#     mode: udp
#     target: 127.0.0.1:5353
