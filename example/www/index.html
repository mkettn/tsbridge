<!--
  Small example status page for tsbridge's read-only management API (see
  README.md's "Management API" section): lists bridges and their
  health, talking to the API directly from the browser with plain
  fetch() calls against relative URLs.

  Served by Caddy (see ../Caddyfile) on http://localhost:1235, the same
  origin Caddy reverse-proxies /bridges and /bridges/* to tsbridge's
  management socket on -- so these fetch() calls need no CORS setup and
  no hardcoded host/port. This file is the *only* thing under this
  directory (example/www/), deliberately: Caddy's root for this site is
  scoped to example/www/ rather than example/ itself, so a static file
  server here can never accidentally serve config.yaml, state/ (which
  holds this node's tsnet identity keys), or the bridge sockets.

  tsbridge needs to be running first (pointed at ../config.yaml, which
  sets management_socket) so that socket exists for Caddy to proxy to.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tsbridge bridges</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    max-width: 46rem;
    margin: 2.5rem auto;
    padding: 0 1.25rem;
  }
  h1 { font-size: 1.3rem; margin-bottom: .2rem; }
  .sub { opacity: .65; margin-top: 0; font-size: .9rem; }
  table { width: 100%; border-collapse: collapse; margin: 1.25rem 0; }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid currentColor; border-color: color-mix(in srgb, currentColor 15%, transparent); font-size: .88rem; vertical-align: top; }
  th { font-weight: 600; opacity: .7; font-size: .78rem; text-transform: uppercase; letter-spacing: .02em; }
  code { font-size: .85em; opacity: .85; }
  .empty { opacity: .6; font-style: italic; }
  .badge { display: inline-block; padding: .05rem .45rem; border-radius: 1rem; font-size: .75rem; border: 1px solid currentColor; opacity: .75; }
  #error { color: #c0362c; white-space: pre-wrap; font-size: .88rem; margin: .75rem 0; }
  #error:empty { display: none; }
  #status { display: flex; flex-wrap: wrap; gap: .4rem .6rem; align-items: center; margin: 1rem 0; font-size: .88rem; }
  #status .badge.ok { border-color: #2a8f4d; color: #2a8f4d; }
  #status .badge.warn { border-color: #c0362c; color: #c0362c; }
  .state-off { opacity: .55; }
  .state-error { color: #c0362c; }
  small.hint { opacity: .6; }
</style>
</head>
<body>
<h1>tsbridge bridges</h1>
<p class="sub">Talking to <code>/bridges</code> and <code>/status</code> on this origin, proxied by Caddy to tsbridge's <code>management_socket</code>.</p>

<div id="status"></div>
<div id="error"></div>

<table>
  <thead>
    <tr><th>Name</th><th>Mode</th><th>State</th><th>Listen</th><th>Target</th></tr>
  </thead>
  <tbody id="rows"><tr><td colspan="5" class="empty">loading&hellip;</td></tr></tbody>
</table>

<script>
"use strict";

const rowsEl = document.getElementById("rows");
const errorEl = document.getElementById("error");
const statusEl = document.getElementById("status");

function showError(message) {
  errorEl.textContent = message;
}

// messageFromResponse reads the management API's {"error": "..."} JSON
// body (see manage.go's writeError) for a non-2xx response, falling
// back to the plain status line if the body isn't JSON for some reason.
async function messageFromResponse(res) {
  try {
    const data = await res.clone().json();
    if (data && typeof data.error === "string") return data.error;
  } catch {
    // fall through to the status line below
  }
  return `${res.status} ${res.statusText}`;
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  for (const child of children || []) node.append(child);
  return node;
}

// stateCell describes bridge's State column: text plus a class for
// styling (state-off for a deliberately disabled bridge, state-error
// for a crashed/failed one), and an optional hint (dial health) shown
// underneath.
function stateCell(bridge) {
  let text, className = "";
  if (!bridge.enabled) {
    text = "disabled";
    className = "state-off";
  } else if (bridge.running) {
    text = "running";
  } else {
    text = "not running";
    className = "state-error";
  }
  const children = [document.createTextNode(text)];
  if (bridge.error) {
    children.push(el("br"), el("small", { className: "hint", textContent: bridge.error }));
  } else if (bridge.dial_failures > 0) {
    children.push(el("br"), el("small", { className: "hint", textContent: `${bridge.dial_failures} dial failure(s): ${bridge.last_dial_error}` }));
  }
  return el("td", { className }, children);
}

function renderRow(bridge) {
  return el("tr", {}, [
    el("td", {}, [el("code", { textContent: bridge.name })]),
    el("td", { textContent: bridge.mode + (bridge.mode === "http" && bridge.rewrite_host ? " (rewrite_host)" : "") }),
    stateCell(bridge),
    el("td", {}, [el("code", { textContent: bridge.listen })]),
    el("td", {}, [el("code", { textContent: (bridge.target || []).join(", ") })]),
  ]);
}

async function refreshStatus() {
  try {
    const res = await fetch("/status");
    if (!res.ok) throw new Error(await messageFromResponse(res));
    const st = await res.json();
    const stateBadge = el("span", {
      className: "badge " + (st.backend_state === "Running" ? "ok" : "warn"),
      textContent: st.backend_state,
    });
    const children = [stateBadge];
    if (st.tailnet) children.push(document.createTextNode(st.tailnet));
    if (st.tailscale_ips && st.tailscale_ips.length) children.push(el("code", { textContent: st.tailscale_ips.join(", ") }));
    for (const warning of st.health || []) {
      children.push(el("span", { className: "badge warn", textContent: warning }));
    }
    statusEl.replaceChildren(...children);
  } catch (err) {
    statusEl.replaceChildren(el("span", { className: "badge warn", textContent: `status unavailable: ${err.message || err}` }));
  }
}

async function refresh() {
  refreshStatus();

  let bridges;
  try {
    const res = await fetch("/bridges");
    if (!res.ok) throw new Error(`listing bridges: ${await messageFromResponse(res)}`);
    bridges = await res.json();
  } catch (err) {
    showError(String(err.message || err));
    return;
  }
  showError("");

  rowsEl.replaceChildren();
  if (!bridges || bridges.length === 0) {
    rowsEl.append(el("tr", {}, [el("td", { colSpan: 5, className: "empty", textContent: "no bridges configured" })]));
    return;
  }
  bridges.sort((a, b) => a.name.localeCompare(b.name));
  for (const bridge of bridges) rowsEl.append(renderRow(bridge));
}

refresh();
</script>
</body>
</html>
