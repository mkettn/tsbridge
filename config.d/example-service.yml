# Example config.d/ drop-in. Files here are merged into the bridge set
# defined by the main config's `include:` glob (see config.example.yaml).
#
# Drop-in files may ONLY set `bridges:` -- they must not set `include`,
# `hostname`, `state_dir`, etc; those belong in the main config file.
#
# `name` and `listen` must be unique across this file, every other
# config.d/ file, and the main config's inline `bridges:` list.
bridges:
  - name: other-service
    listen: /run/tsbridge/other-service.sock
    target: other-machine:5678
